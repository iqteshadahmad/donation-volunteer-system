{% extends 'base-db-donor.html' %}
{% load static %}
{% block main %}

<style>
    :root {
        --bg: linear-gradient(135deg, #fdf2f8 0%, #f3e8ff 100%);
        --card: rgba(255, 255, 255, 0.95);
        --shadow: 0 30px 80px rgba(0,0,0,0.15);
        --accent: #6366f1;
        --text: #1e293b;
    }
    body { background: var(--bg); min-height: 100vh; }

    .profile-container {
        padding: 3rem 1.5rem;
        max-width: 1000px;
        margin: 0 auto;
    }

    .profile-card {
        background: var(--card);
        border-radius: 32px;
        overflow: hidden;
        box-shadow: var(--shadow);
        backdrop-filter: blur(15px);
        border: 1px solid rgba(255,255,255,0.6);
        transition: all 0.6s ease;
    }
    .profile-card:hover {
        transform: translateY(-15px);
        box-shadow: 0 40px 100px rgba(99,102,241,0.25);
    }

    .card-header {
        background: linear-gradient(135deg, #6366f1, #4f46e5);
        color: white;
        padding: 1rem;
        text-align: center;
        font-size: 2.4rem;
        font-weight: 800;
        letter-spacing: 2px;
        text-shadow: 0 5px 20px rgba(0,0,0,0.4);
    }

    .form-body {
        padding: 3rem;
        max-height: 75vh;
        overflow-y: auto;
        scrollbar-width: thin;
    }
    .form-body::-webkit-scrollbar { width: 10px; }
    .form-body::-webkit-scrollbar-track { background: #f8fafc; border-radius: 10px; }
    .form-body::-webkit-scrollbar-thumb { background: linear-gradient(#a78bfa, #818cf8); border-radius: 10px; }

    .form-row {
        display: flex;
        flex-wrap: wrap;
        gap: 1.8rem;
        margin-bottom: 1.5rem;
    }

    .form-group {
        flex: 1;
        min-width: 280px;
        position: relative;
    }

    .form-group label {
        position: absolute;
        top: -10px;
        left: 18px;
        background: white;
        padding: 0 10px;
        font-weight: 700;
        color: var(--accent);
        font-size: 0.95rem;
        transition: all 0.3s ease;
        pointer-events: none;
    }

    .form-control, textarea.form-control {
        border: 2px solid #e0d4ff;
        border-radius: 18px;
        padding: 1.2rem 1.5rem;
        font-size: 1.1rem;
        transition: all 0.4s ease;
        background: #fdfdfd;
        box-shadow: 0 5px 15px rgba(0,0,0,0.05);
    }

    .form-control:focus, textarea.form-control:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 4px rgba(99,102,241,0.2);
        outline: none;
        transform: translateY(-3px);
    }

    .form-control[readonly] {
        background: #f3f4f6;
        color: #6b7280;
        cursor: not-allowed;
    }

    .profile-img-preview {
        width: 140px;
        height: 140px;
        border-radius: 50%;
        object-fit: cover;
        border: 6px solid white;
        box-shadow: 0 15px 40px rgba(99,102,241,0.4);
        transition: all 0.6s ease;
    }
    .profile-img-preview:hover {
        transform: scale(1.15);
        box-shadow: 0 25px 60px rgba(99,102,241,0.6);
    }

    .btn-update {
        background: linear-gradient(135deg, #6366f1, #4f46e5);
        color: white;
        padding: 1rem 3.5rem;
        border: none;
        border-radius: 50px;
        font-size: 1.3rem;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 15px 35px rgba(99,102,241,0.4);
        transition: all 0.5s ease;
        position: relative;
        overflow: hidden;
        margin-top: 2rem;
    }
    .btn-update::before {
        content: '';
        position: absolute;
        top: 50%; left: 50%;
        width: 0; height: 0;
        background: rgba(255,255,255,0.3);
        border-radius: 50%;
        transform: translate(-50%, -50%);
        transition: width 0.6s, height 0.6s;
    }
    .btn-update:hover::before {
        width: 300px;
        height: 300px;
    }
    .btn-update:hover {
        transform: translateY(-8px);
        box-shadow: 0 25px 50px rgba(99,102,241,0.5);
    }

    .alert {
        border-radius: 16px;
        padding: 1.2rem;
        margin: 1.5rem 0;
        font-weight: 600;
    }

    @media (max-width: 768px) {
        .card-header { font-size: 2rem; padding: 2rem 1.5rem; }
        .form-body { padding: 2rem; }
        .form-row { gap: 1.2rem; }
        .profile-img-preview { width: 110px; height: 110px; }
    }
</style>

<div class="profile-container">
    <div class="profile-card">
        <div class="card-header">
            My Profile
        </div>

        <div class="form-body">
            <form action="" method="post" enctype="multipart/form-data" novalidate>
                {% csrf_token %}

                <div class="form-row">
                    <div class="form-group">
                        <label>First Name</label>
                        <input type="text" name="firstname" class="form-control" value="{{donor.user.first_name}}" pattern="[A-Za-z]+" required>
                    </div>
                    <div class="form-group">
                        <label>Last Name</label>
                        <input type="text" name="lastname" class="form-control" value="{{donor.user.last_name}}" pattern="[A-Za-z]+" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Email ID</label>
                        <input type="email" name="email" class="form-control" value="{{donor.user.email}}" readonly>
                    </div>
                    <div class="form-group">
                        <label>Contact</label>
                        <input type="text" name="contact" class="form-control" value="{{donor.contact}}" required>
                    </div>
                </div>

                <div class="form-row" style="align-items: center;">
                    <div class="form-group">
                        <label>User PIC</label>
                        <input type="file" name="userpic" class="form-control" accept="image/*">
                    </div>
                    <div class="form-group text-center">
                        <img src="{{donor.userpic.url}}" class="profile-img-preview" alt="Profile Picture">
                    </div>
                </div>

                <div class="form-group">
                    <label>Address</label>
                    <textarea name="address" class="form-control" rows="4" placeholder="Enter your full address">{{donor.address}}</textarea>
                </div>

                <div class="text-center">
                    <button type="submit" class="btn-update">Update Profile</button>
                </div>

                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-{{ message.tags }} text-center">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            </form>
        </div>
    </div>
</div>

<!-- Ensure smooth scroll in main content -->
<script>
    document.querySelector('.home_content')?.style = 'overflow-y:auto; padding-bottom:4rem;';
</script>

{% endblock main %}
