{% extends 'base-db-admin.html' %}
{% load static %}
{% block main %}

<style>
    #mytable {
        background: white;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 15px 40px rgba(0,0,0,0.12);
        border: none !important;
        font-size: 0.98rem;
    }

    #mytable thead {
        background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%);
        color: white;
        text-transform: uppercase;
        letter-spacing: 1.1px;
        font-weight: 600;
        font-size: 0.92rem;
    }

    #mytable th {
        padding: 1.4rem 1rem !important;
        border: none;
        text-shadow: 0 2px 5px rgba(0,0,0,0.4);
    }

    #mytable tbody tr {
        transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.2);
        background-color: #fdfdfd;
    }

    #mytable tbody tr:nth-child(even) {
        background-color: #faf5ff;
    }

    #mytable tbody tr:hover {
        background: linear-gradient(135deg, #ede9fe 0%, #ddd6fe 100%) !important;
        transform: translateY(-5px);
        box-shadow: 0 15px 35px rgba(124, 58, 237, 0.22);
        z-index: 10;
    }

    #mytable td {
        padding: 1.3rem 1rem !important;
        vertical-align: middle;
        color: #1f2937;
        font-weight: 500;
        border-bottom: 1px solid #e2e8f0;
    }

    /* Action Buttons */
    .btn-action {
        padding: 0.6rem 1.8rem;
        border-radius: 50px;
        font-weight: bold;
        font-size: 0.95rem;
        text-decoration: none;
        display: inline-block;
        min-width: 90px;
        text-align: center;
        box-shadow: 0 6px 18px rgba(0,0,0,0.15);
        transition: all 0.4s ease;
    }

    .btn-edit {
        background: linear-gradient(135deg, #3b82f6, #2563eb);
        color: white !important;
    }

    .btn-delete {
        background: linear-gradient(135deg, #ef4444, #dc2626);
        color: white !important;
    }

    .btn-action:hover {
        transform: translateY(-4px);
        box-shadow: 0 15px 30px rgba(0,0,0,0.25);
    }

    .btn-edit:hover {
        background: linear-gradient(135deg, #2563eb, #1d4ed8);
    }

    .btn-delete:hover {
        background: linear-gradient(135deg, #dc2626, #b91c1c);
    }

    @media (max-width: 768px) {
        #mytable thead { font-size: 0.82rem; }
        #mytable td, #mytable th { padding: 1rem 0.6rem !important; }
        .btn-action { padding: 0.5rem 1.2rem; font-size: 0.9rem; }
    }
</style>

<div class="container mt-5 table-responsive">
    <h3 class="text-center mb-4 fw-bold" style="color: #7c3aed; letter-spacing: 1px;">
        Manage Area
    </h3>
    <hr class="bg-purple opacity-40 w-25 mx-auto mb-5">

    <table id="mytable" class="table data align-middle text-center">
        <thead>
            <tr>
                <th scope="col">#</th>
                <th>Area Name</th>
                <th>Creation Date</th>
                <th>Action</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            {% for i in area %}
            <tr>
                <td><strong>{{ forloop.counter }}</strong></td>
                <td class="fw-semibold">{{ i.areaname }}</td>
                <td>{{ i.creationdate|date:"d M Y" }}</td>
                <td>
                    <a href="{% url 'edit_area' i.id %}" class="btn-action btn-edit">
                        Edit
                    </a>
                </td>
                <td>
                    <a href="{% url 'delete_area' i.id %}" 
                       class="btn-action btn-delete"
                       onclick="return confirm('Are you sure you want to delete this area permanently?')">
                        Delete
                    </a>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="5" class="text-center py-5 text-muted fst-italic fs-4">
                    No areas found
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

{% endblock main %}
