{% extends 'base-db-admin.html' %}
{% load static %}
{% block main %}

<style>
    .donor-card {
        background: white;
        border-radius: 24px;
        overflow: hidden;
        box-shadow: 0 20px 50px rgba(0,0,0,0.12);
        max-width: 1100px;
        margin: 2rem auto;
        border: none;
    }

    .donor-header {
        background: linear-gradient(135deg, #4361ee 0%, #3f37c9 100%);
        color: white;
        padding: 2.2rem;
        text-align: center;
        font-size: 1.9rem;
        font-weight: 700;
        letter-spacing: 1.2px;
        text-shadow: 0 3px 10px rgba(0,0,0,0.3);
    }

    #mytable {
        width: 100% !important;
        border: none !important;
        max-height: 85vh;
        overflow-y: auto;
        display: block;
        scrollbar-width: thin;
        scrollbar-color: #4361ee #f0f4ff;
    }

    #mytable::-webkit-scrollbar { width: 10px; }
    #mytable::-webkit-scrollbar-track { background: #f0f4ff; border-radius: 10px; }
    #mytable::-webkit-scrollbar-thumb { background: #4361ee; border-radius: 10px; }

    #mytable td {
        padding: 2rem 2.2rem !important;
        vertical-align: middle;
        font-size: 1.1rem;
        color: #1f2937;
        border-bottom: 1px solid #e2e8f0;
        transition: all 0.3s ease;
        width:40%;
    }

    #mytable tr:hover td {
        background-color: #f0f4ff !important;
    }

    #mytable h5 {
        margin: 0;
        font-weight: 600;
        color: #374151;
        font-size: 1.2rem;
    }

    .text-secondary {
        color: #4361ee !important;
        font-weight: 700;
        font-size: 1.25rem;
    }

    #mytable img {
        width: 140px;
        height: 140px;
        border-radius: 24px;
        object-fit: cover;
        border: 6px solid #e5e7eb;
        box-shadow: 0 12px 30px rgba(0,0,0,0.15);
        transition: all 0.5s ease;
    }

    #mytable img:hover {
        transform: scale(1.25);
        border-color: #4361ee;
        box-shadow: 0 25px 50px rgba(67, 97, 238, 0.4);
    }

    /* Delete Button Styling */
    .delete-btn {
        background: linear-gradient(135deg, #ef4444, #dc2626);
        color: white;
        padding: 1rem 3rem;
        border-radius: 50px;
        font-weight: bold;
        font-size: 1.2rem;
        text-decoration: none;
        display: inline-block;
        box-shadow: 0 10px 30px rgba(239, 68, 68, 0.4);
        transition: all 0.4s ease;
        border: none;
        cursor: pointer;
    }

    .delete-btn:hover {
        transform: translateY(-6px);
        box-shadow: 0 20px 40px rgba(239, 68, 68, 0.5);
        background: linear-gradient(135deg, #dc2626, #b91c1c);
        color:white;
    }

    .delete-cell {
        background: #fee2e2 !important;
        padding: 2.5rem !important;
    }

    @media (max-width: 768px) {
        .donor-card { margin: 1rem; border-radius: 18px; }
        #mytable img { width: 100px; height: 100px; }
        #mytable td { padding: 1.5rem !important; font-size: 1rem; }
        .delete-btn { padding: 0.9rem 2rem; font-size: 1.1rem; }
    }
</style>

<div class="container-fluid px-4">
    <div class="donor-card">
        <div class="donor-header">
            View Donor Detail
        </div>

        <table id="mytable" class="table align-middle text-center">
            <tbody>
                <tr>
                    <td><h5>Donor Name</h5></td>
                    <td><h5 class="text-secondary">{{donor.user.first_name}} {{donor.user.last_name}}</h5></td>
                    <td><h5>Donor Contact</h5></td>
                    <td><h5 class="text-secondary">{{donor.contact}}</h5></td>
                </tr>

                <tr>
                    <td><h5>Email</h5></td>
                    <td colspan="2"><h5 class="text-secondary">{{donor.user.email}}</h5></td>
                    <td rowspan="2">
                        <img src="{{donor.userpic.url}}" alt="Donor Photo">
                    </td>
                </tr>

                <tr>
                    <td><h5>Donor Pic</h5></td>
                    <td colspan="2"></td>
                </tr>

                <!-- Delete Donor Button Row -->
                <tr class="delete-cell">
                    <td colspan="4">
                        <a href="{% url 'delete_donor' donor.user.id %}" 
                           onclick="return confirm('Are you sure you want to delete this donor permanently?')"
                           class="delete-btn">
                            Delete Donor
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

{% endblock main %}
