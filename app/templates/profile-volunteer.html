{% extends 'base-db-volunteer.html' %}
{% load static %}
{% block main %}

<style>
    :root {
        --bg: linear-gradient(135deg, #fdf2f8 0%, #f3e8ff 100%);
        --card: rgba(255, 255, 255, 0.95);
        --shadow: 0 30px 80px rgba(0,0,0,0.15);
        --accent: #6366f1;
        --accent-dark: #4f46e5;
        --text: #1e293b;
    }

    .profile-container {
        padding: 3rem 1.5rem;
        max-width: 1000px;
        margin: 0 auto;
    }

    .profile-card {
        background: var(--card);
        border-radius: 32px;
        overflow: hidden;
        box-shadow: var(--shadow);
        backdrop-filter: blur(15px);
        border: 1px solid rgba(255,255,255,0.6);
        transition: all 0.6s ease;
    }

    .profile-card:hover {
        transform: translateY(-15px);
        box-shadow: 0 40px 100px rgba(99,102,241,0.25);
    }

    .card-header {
        background: linear-gradient(135deg, var(--accent), var(--accent-dark));
        color: white;
        padding: 1.2rem;
        text-align: center;
        font-size: 2.4rem;
        font-weight: 800;
        letter-spacing: 2px;
        text-shadow: 0 5px 20px rgba(0,0,0,0.4);
    }

    .form-body {
        padding: 3rem;
        max-height: 75vh;
        overflow-y: auto;
        scrollbar-width: thin;
    }

    .form-body::-webkit-scrollbar {
        width: 10px;
    }

    .form-body::-webkit-scrollbar-thumb {
        background: linear-gradient(#a78bfa, #818cf8);
        border-radius: 10px;
    }

    .form-row {
        display: flex;
        flex-wrap: wrap;
        gap: 1.8rem;
        margin-bottom: 1.5rem;
    }

    .form-group {
        flex: 1;
        min-width: 280px;
        position: relative;
        margin-bottom: 1rem;
    }

    .form-group label {
        position: absolute;
        top: -10px;
        left: 18px;
        background: white;
        padding: 0 10px;
        font-weight: 700;
        color: var(--accent);
        font-size: 0.95rem;
        transition: 0.3s ease;
        pointer-events: none;
    }

    .form-control, textarea.form-control {
        border: 2px solid #e0d4ff;
        border-radius: 18px;
        padding: 1.2rem 1.5rem;
        font-size: 1.1rem;
        background: #fdfdfd;
        box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        transition: 0.4s ease;
    }

    .form-control:focus,
    textarea.form-control:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 4px rgba(99,102,241,0.25);
        transform: translateY(-4px);
    }

    .form-control[readonly] {
        background: #f3f4f6;
        color: #6b7280;
        cursor: not-allowed;
    }

    .profile-img-preview {
        width: 140px;
        height: 140px;
        border-radius: 50%;
        object-fit: cover;
        border: 6px solid white;
        box-shadow: 0 15px 40px rgba(99,102,241,0.4);
        transition: 0.6s ease;
    }

    .profile-img-preview:hover {
        transform: scale(1.18);
        box-shadow: 0 25px 60px rgba(99,102,241,0.55);
    }

    .btn-update {
        background: linear-gradient(135deg, var(--accent), var(--accent-dark));
        color: white;
        padding: 1rem 3.5rem;
        border: none;
        border-radius: 50px;
        font-size: 1.3rem;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 15px 35px rgba(99,102,241,0.4);
        transition: 0.5s ease;
        position: relative;
        overflow: hidden;
        margin-top: 2rem;
    }

    .btn-update:hover {
        transform: translateY(-8px);
        box-shadow: 0 25px 50px rgba(99,102,241,0.55);
    }

    .btn-update::before {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        width: 0;
        height: 0;
        background: rgba(255,255,255,0.3);
        border-radius: 50%;
        transform: translate(-50%, -50%);
        transition: width 0.7s, height 0.7s;
    }

    .btn-update:hover::before {
        width: 300px;
        height: 300px;
    }
</style>

<div class="profile-container">
    <div class="profile-card">

        <div class="card-header">
            My Profile
        </div>

        <div class="form-body">

            <form action="" method="post" enctype="multipart/form-data" novalidate>
                {% csrf_token %}

                <!-- First + Last Name -->
                <div class="form-row">
                    <div class="form-group">
                        <label>First Name</label>
                        <input type="text" name="firstname" class="form-control"
                               pattern="[A-Za-z]+" value="{{volunteer.user.first_name}}">
                    </div>

                    <div class="form-group">
                        <label>Last Name</label>
                        <input type="text" name="lastname" class="form-control"
                               pattern="[A-Za-z]+" value="{{volunteer.user.last_name}}">
                    </div>
                </div>

                <!-- Email + Contact -->
                <div class="form-row">
                    <div class="form-group">
                        <label>Email ID</label>
                        <input type="email" name="email" class="form-control"
                               value="{{volunteer.user.email}}" readonly>
                    </div>

                    <div class="form-group">
                        <label>Contact</label>
                        <input type="text" name="contact" class="form-control"
                               value="{{volunteer.contact}}">
                    </div>
                </div>

                <!-- Photo + Preview -->
                <div class="form-row" style="align-items:center;">
                    <div class="form-group">
                        <label>User PIC</label>
                        <input type="file" name="userpic" class="form-control">
                    </div>

                    <div class="form-group text-center">
                        <img src="{{volunteer.userpic.url}}" class="profile-img-preview">
                    </div>
                </div>

                <!-- ID Proof -->
                <div class="form-row" style="align-items:center;">
                    <div class="form-group">
                        <label>ID Proof PIC</label>
                        <input type="file" name="idpic" class="form-control">
                    </div>

                    <div class="form-group text-center">
                        <img src="{{volunteer.idpic.url}}" class="profile-img-preview">
                    </div>
                </div>

                <!-- Address -->
                <div class="form-group">
                    <label>Address</label>
                    <textarea name="address" class="form-control" rows="3">{{volunteer.address}}</textarea>
                </div>

                <!-- About -->
                <div class="form-group">
                    <label>About Yourself</label>
                    <textarea name="aboutme" class="form-control" rows="3">{{volunteer.aboutme}}</textarea>
                </div>

                <!-- Submit -->
                <div class="text-center">
                    <button type="submit" class="btn-update">Update Profile</button>
                </div>

                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-{{ message.tags }} text-center mt-3">{{ message }}</div>
                    {% endfor %}
                {% endif %}

            </form>
        </div>
    </div>
</div>

<script>
    document.querySelector('.home_content')?.style.overflowY = 'auto';
</script>

{% endblock main %}
